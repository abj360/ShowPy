repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
      - id: prettier
        name: prettier (md, yaml, json)
        entry: npx --yes prettier@3.6.2 --check
        language: system
        types_or: [markdown, yaml, json]
