default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^docs/guide/stage-library-guide\.pdf$
      - id: check-merge-conflict
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: []
        exclude: ^tests/unit/choreo/test_form_ops\.py$
  - repo: local
    hooks:
      - id: lint
        name: nox lint
        entry: uv run nox -s lint
        language: system
        pass_filenames: false
        types_or: [python, markdown, yaml, json, toml]
      - id: types
        name: nox types
        entry: uv run nox -s types
        language: system
        pass_filenames: false
        types: [python]
      - id: lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: tests
        name: nox tests
        entry: uv run nox -s tests
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
