# cargo about generate, as scripts/gen_third_party_notices.py runs it. For a crate that offers a
# choice of licences, the first accepted one in this order is the licence the notice names.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
]
# Build scripts, proc-macro hosts' build dependencies and test-only crates are never linked.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are unpublished and carry the project licence.
private = { ignore = true }
