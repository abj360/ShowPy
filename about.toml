# cargo about generate --format json, as scripts/gen_third_party_notices.py runs it. For a crate
# that offers a choice of licences, the first accepted one in this order is the one named.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
]
# Build scripts' and tests' crates are never linked; the script drops proc macros itself.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are unpublished and carry the project licence.
private = { ignore = true }
