# git-cliff configuration: groups Conventional Commits into CHANGELOG.md.
# Regenerate at release time only: uv run nox -s changelog

[changelog]
header = """# Changelog

Generated by git-cliff from Conventional Commits. A change to a public name must be \
named in the subject or BREAKING CHANGE footer of its commit, so its release section names it.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### BREAKING CHANGES

{% for commit in breaking %}\
- {{ commit.breaking_description | default(value=commit.message) | trim | replace(from="\n", to=" ") }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false
commit_parsers = [
    # 0f8a28a reverted this behavior before any release; the entry would contradict the shipped code.
    { message = '^feat\(export\): read legacy stage\.show\.v1 documents$', sha = "e0b7ad172d724db5b72fb0c6d1d7faad530c4d92", skip = true },
    { message = "^merge", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^test", group = "<!-- 4 -->Tests" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = "^ci", group = "<!-- 7 -->CI" },
    { message = "^chore", group = "<!-- 8 -->Chores" },
    { message = "^style", group = "<!-- 9 -->Style" },
]

# Commits that changed public behavior without a breaking-change footer. History is not
# rewritten (ruling R14 of the phase 1 plan), so these rewrite the messages git-cliff reads.

# d1f16d3 renamed the distribution.
[[git.commit_preprocessors]]
pattern = '^build: (package as ShowPy with version from the tag and ranged dependencies)\s*$'
replace = """build!: $1

BREAKING CHANGE: the distribution is named ShowPy (was stage); install it as ShowPy."""

# b1e12ed changed the error every model raises.
[[git.commit_preprocessors]]
pattern = '(?s)^fix\(core\): (raise SchemaError from every model constructor)\n(.*)$'
replace = """fix(core)!: $1
${2}

BREAKING CHANGE: `FrozenModel` constructors, `model_validate` and `model_validate_json` \
raise `SchemaError` instead of `pydantic.ValidationError`; `SchemaError` is not a \
`ValueError`, so `except ValueError` no longer catches invalid model data."""

# ea9832c stopped models from holding NaN and infinity.
[[git.commit_preprocessors]]
pattern = '(?s)^fix\(core\): (reject NaN and infinity in every model)\n(.*)$'
replace = """fix(core)!: $1
${2}

BREAKING CHANGE: `FrozenModel` rejects NaN and infinity in every float field, so v0.2.0 \
documents that hold `NaN` or `Infinity` no longer decode; they raise `SchemaError`."""

# 8925ffc wrapped its footer onto a line that git-cliff reads as a new footer, which cut the
# entry after its first line and dropped the new public names.
[[git.commit_preprocessors]]
pattern = '(?s)^(feat\(show\)!: add stored format v2 .*?)\nBREAKING CHANGE: .*$'
replace = """$1

BREAKING CHANGE: `export_json` writes `format: showpy.show` and `version: 2` instead of \
`schema: showpy.show.v1`, and `import_json` reads both, refuses non-strict JSON (lone \
surrogates, NaN) and a v1 tag beside a format header. `save_show`, `load_show` and every \
repository write store show.json with the format header first, so the first save of a v1 show \
writes one revision and a v0.3.0 reader refuses the result; commits and workspace writes \
refuse a show.json without the current header. New public names `migrate_documents`, \
`MigrationReport`, `read_version`, `FORMAT` and `CURRENT_VERSION`."""
