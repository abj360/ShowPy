[package]
name = "e8s-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "_core"
# The rlib lets the integration tests call the binding's Rust functions.
crate-type = ["cdylib", "rlib"]

[dependencies]
e8s-core = { path = "../e8s-core" }
# No `extension-module` feature: maturin sets PYO3_BUILD_EXTENSION_MODULE, so the wheel leaves
# libpython unlinked, while `cargo test` links it and the tests embed an interpreter.
pyo3 = { version = "=0.30.1", features = ["abi3-py313"] }
numpy = "=0.30.0"

[dev-dependencies]
pyo3 = { version = "=0.30.1", features = ["auto-initialize"] }

[build-dependencies]
pyo3-build-config = "=0.30.1"
