[workspace]
resolver = "3"
members = ["crates/e8s-core", "crates/e8s-py", "crates/e8s-wasm"]
# The cargo-fuzz crate builds only on the nightly toolchain, so it keeps its own lock file.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.100"
publish = false

[workspace.dependencies]
libm = "=0.2.16"

# Core functions return errors instead of panicking, and no crate of ours holds unsafe code.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Local and editable builds: thin LTO keeps a rebuild after one changed file short.
[profile.release]
lto = "thin"

# Release wheels and the wasm build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The dist codegen, unstripped and with line tables, for the FMA disassembly check: symbols and
# inlining records name the function each instruction came from.
[profile.fma-check]
inherits = "dist"
strip = "none"
debug = "line-tables-only"
