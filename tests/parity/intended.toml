# Cases whose output differs from v0.4.0 by the maintainer's decision, not by a ledger defect.
# Each is compared with the outputs in `expect` (gated keys hold float lists, other keys JSON
# values), never with the oracle, and the parity table prints it as `intended` with its reason.
# Add an entry in the commit that makes the difference, and only for a case that a
# tests/parity/cases_<area>.py defines; a case is flipped.toml's or this file's, never both.
#
# [[case]]
# name = "<area>.<case>"
# reason = "<one line>"
# expect = { "<key>" = <value> }

[[case]]
name = "core.non_finite_inputs_raise_e8s_errors"
reason = "public APIs raise E8sError subclasses, not ValueError or OverflowError"
expect = { facing_vector = [
  { error = "SchemaError", code = "SCHEMA" },
  { error = "SchemaError", code = "SCHEMA" },
  { error = "SchemaError", code = "SCHEMA" },
], format_number = [{ error = "SchemaError", code = "SCHEMA" }] }

[[case]]
name = "core.util_inputs_v040_mishandled"
reason = "lone surrogates show as U+FFFD in errors; other number types split as floats; other part types and non-text names raise TypeError"
expect = { surrogate_errors = [
  { error = "SchemaError", detail = "{'type': 'SchemaError', 'code': 'SCHEMA', 'message': \"number in 'T\\ufffd99999999999999999999999999999999999999999999999999999999999999'... has 65 digits\", 'hint': 'IDs hold at most 64 characters, so no number is longer', 'context': {'digits': 65, 'max': 64}}" },
  { error = "SchemaError", detail = "{'type': 'SchemaError', 'code': 'SCHEMA', 'message': \"bad range '\\ufffd-'\", 'hint': 'write ranges as T1-T8', 'context': {'text': '\\ufffd-'}}" },
  { error = "SchemaError", detail = "{'type': 'SchemaError', 'code': 'SCHEMA', 'message': \"number in 'T\\ufffd11111111111111111111111111111111111111111111111111111111111111'... has 70 digits\", 'hint': 'IDs hold at most 64 characters, so no number is longer', 'context': {'digits': 70, 'max': 64}}" },
], chunk_counts = [
  { types = ["float", "float", "float"], values = "[0.3333333333333333, 0.3333333333333333, 0.33333333333333337]" },
  { types = ["float", "float", "float"], values = "[0.5, 0.5, 0.5]" },
  { types = ["float", "float", "float", "float"], values = "[2.25, 2.25, 2.25, 2.25]" },
  { types = ["float", "float", "float"], values = "[2.6666666666666665, 2.6666666666666665, 2.666666666666667]" },
  { error = "TypeError", detail = "" },
], close_matches = [
  { error = "TypeError", detail = "" },
  { error = "TypeError", detail = "" },
] }
