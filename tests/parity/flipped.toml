# Cases whose v0.4.0 output was a ledger defect the working tree fixed. Each is compared with
# the fixed outputs in `expect` (gated keys hold float lists, other keys JSON values), never
# with the oracle. Add an entry in the commit that flips the ledger test, and only for a case
# that a tests/parity/cases_<area>.py defines; the loader refuses any other name.
#
# [[case]]
# name = "<area>.<case>"
# ledger = "UP-<section>-<nn>"
# expect = { "<key>" = <value> }
