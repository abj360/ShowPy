# UP-9.1-17 and UP-9.1-18 were flipped in L0.4 (commit c56df2b1, `is_similarity` judges with a
# scale-relative tolerance) before any geo parity case existed. Lane G lists its
# `is_similarity` cases here with those two ledger IDs.
