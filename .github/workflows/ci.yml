name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: |
          npm ci
          uv run nox -s lint
      - name: Type-check
        run: uv run nox -s types
      - name: Test
        run: uv run nox -s tests hashseeds
      - name: Dependency scan
        run: uv run nox -s audit

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml build
