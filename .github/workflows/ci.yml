name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: |
          uv run ruff format --check . && uv run ruff check .
          npx --yes prettier@3.6.2 --check "**/*.{md,yml,yaml,json}"
      - name: Type-check
        run: uv run mypy stage tests
      - name: Test
        run: uv run pytest
      - name: Dependency scan
        run: |
          uv export --format requirements-txt --no-emit-project > requirements.txt
          uv run pip-audit --strict --disable-pip --require-hashes -r requirements.txt

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml build
