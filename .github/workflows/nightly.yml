name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - name: tests
        run: uv run nox -s tests
        env:
          HYPOTHESIS_PROFILE: nightly
      - name: slow
        run: uv run nox -s slow
        env:
          HYPOTHESIS_PROFILE: nightly
      - run: uv run nox -s bench -- --tier L
