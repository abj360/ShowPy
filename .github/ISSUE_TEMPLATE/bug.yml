name: Bug report
description: Report a defect in ShowPy
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issues go through private vulnerability reporting, not here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: showpy, Python and OS
    validations:
      required: true
