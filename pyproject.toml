[project]
name = "e8s"
dynamic = ["version"]
description = "Choreography library: sheets, spots, sets, forms and motion."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0 AND MIT AND OFL-1.1 AND LicenseRef-Hershey-Fonts"
license-files = ["LICENSE", "e8s/schemas/LICENSE-MIT.txt", "e8s/fonts/licenses/*.txt"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-core>=2.50.4",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
tables = ["pandas>=3.1.1"]
all = ["pandas>=3.1.1"]

[project.urls]
Homepage = "https://github.com/abj360/e8s"
Repository = "https://github.com/abj360/e8s"
Issues = "https://github.com/abj360/e8s/issues"

[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/e8s-py/Cargo.toml"
module-name = "e8s._core"
python-source = "."
python-packages = ["e8s"]
# A build from the sdist compiles with the pinned toolchain too.
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

# uv reinstalls the project, and so rebuilds e8s._core, when any of these files changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

# The suite exercises every extra-gated function, so the dev environment installs them all.
[dependency-groups]
dev = [
    "e8s[all]",
    "deptry==0.25.1",
    "git-cliff==2.14.2",
    "hypothesis==6.170.15",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "nox==2026.10.20",
    "pandas-stubs==3.1.0.261029",
    "pillow==13.0.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-benchmark==5.3.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "rfc8785==0.1.4",
    "ruff==0.17.5",
    "scipy-stubs==1.18.1.1",
    "types-jsonschema==4.26.0.20261006",
    "types-shapely==2.1.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
allowed-confusables = ["–"]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PT", "D",
    "EXE", "PIE", "PGH", "RSE", "ISC", "LOG", "DTZ", "PTH", "FURB", "ARG", "PERF", "C90", "TID",
    "FBT",
]
ignore = ["D105", "D107", "D104", "D200", "D212", "D401", "D413", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# Library code and its doctests never import the test folder (HANDOFF trap, 2026-11-11).
[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tests".msg = "e8s never imports the test folder; use e8s.examples"

# RUF012: pydantic copies field defaults per instance, so {} defaults are safe.
[tool.ruff.lint.per-file-ignores]
"e8s/**/models.py" = ["RUF012"]
"e8s/**/*_models.py" = ["RUF012"]
"tests/**" = ["D", "EXE001", "FBT001", "FBT002", "TID251", "TID253"]
"scripts/**" = ["EXE001"]
# The fixture script runs in a released checkout and takes its seeded show from the test helpers.
"scripts/make_{legacy,bench}_fixture.py" = ["TID251", "TID253"]
# Test motions implement MotionFn, whose parameter names are part of the protocol.
"tests/unit/choreo/test_{avoid,engine_compile,motion,motion_stats}.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "typings"

[tool.pyright]
include = ["e8s", "tests", "scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests", "e8s"]
pythonpath = ["."]
addopts = [
    "--doctest-modules",
    "-q",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not bench and not slow and not fuzz",
]
markers = [
    "golden: replays real shows against reviewed fixtures",
    "bench: performance budget benchmarks; run with nox -s bench",
    "defect(id): open audited defect; must be xfail(strict=True) with reason equal to the ID",
    "fuzz: hostile-input fuzz targets; run with nox -s fuzz",
    "slow: generated-show properties and the large golden; run with nox -s slow",
    "timing: asserts on wall-clock time; nox -s slow runs these without pytest-xdist workers",
]
filterwarnings = ["error"]
# A test still running after this many seconds dumps every thread's stack, so a CI hang
# names its test before the job is cancelled.
faulthandler_timeout = 60

[tool.deptry]
known_first_party = ["e8s"]

# Pillow installs the PIL module.
[tool.deptry.package_module_name_map]
pillow = "PIL"

# noxfile.py and scripts/build_fonts.py (Pillow) are dev tooling, not shipped code.
[tool.deptry.per_rule_ignores]
DEP004 = ["nox", "PIL"]
