# cargo deny check: the licences, bans, advisories and sources of every crate in the workspace.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
]
# The allow list is the policy for crates the port adds, not a list of the licences in use today.
unused-allowed-license = "allow"
# Our own crates are unpublished and carry the project licence.
private = { ignore = true }

[bans]
deny = [
    { crate = "clipper2", reason = "C++ under BSL-1.0 with no wasm build; use i_overlay" },
    { crate = "geo-clipper", reason = "C++ under BSL-1.0 with no wasm build; use i_overlay" },
    { crate = "cp_sat", reason = "C++ solver; the assignment solvers are our own Rust" },
    { crate = "minicbor", reason = "BlueOak-1.0.0 is outside the licence allow list" },
    { crate = "poisson-diskus", reason = "BlueOak-1.0.0 is outside the licence allow list" },
    { crate = "serde_cbor", reason = "unmaintained" },
]

[advisories]
unmaintained = "all"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
